<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owen's Task Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#435B4D;
    --card:#506F57;
    --secondary:#526B65;
    --green:#84AF78;
    --green-light:#A9CD9E;
    --text:#E5EDF0;
}

.light{
    --bg:#E5EDF0;
    --card:#FFFFFF;
    --secondary:#DCE4E7;
    --text:#1C342C;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:30px;
    transition:.3s;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:3rem;
}

.top-bar{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.top-btn{
    background:var(--green);
    color:#1C342C;
    border:none;
    padding:12px 20px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.left-side{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.task-section,
.completed-section{
    background:var(--card);
    padding:20px;
    border-radius:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.task-section h2,
.completed-section h2{
    color:var(--green-light);
    margin-bottom:15px;
}

.input-group{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.input-group input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:15px;
    background:var(--secondary);
    color:var(--green-light);
    font-weight:700;
}

.input-group input::placeholder{
    color:#bfd8bf;
}

.add-btn{
    background:var(--green);
    border:none;
    padding:12px 16px;
    border-radius:15px;
    cursor:pointer;
    font-weight:700;
    color:#1C342C;
}

.task{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--secondary);
    padding:12px;
    border-radius:15px;
    margin-bottom:10px;
}

.task input{
    width:18px;
    height:18px;
    accent-color:var(--green);
}

.completed-task{
    background:var(--green-light);
    color:#1C342C;
    padding:12px;
    border-radius:15px;
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.tag{
    background:var(--green);
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.clear-btn{
    width:100%;
    background:#1C342C;
    color:white;
    border:none;
    padding:12px;
    border-radius:15px;
    cursor:pointer;
    margin-top:15px;
}

.progress-bar{
    height:12px;
    background:var(--secondary);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:8px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #84AF78,
        #A9CD9E
    );
}

.percent{
    font-size:12px;
    font-weight:700;
    margin-bottom:15px;
}

#historyPage{
    display:none;
}

.history-item{
    background:var(--secondary);
    padding:8px;
    font-size:12px;
    border-radius:10px;
    margin-bottom:6px;
}

.history-date{
    opacity:.75;
    font-size:10px;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<h1>Task Manager</h1>

<div class="top-bar" id="topBar">

<button id="themeToggle" class="top-btn">
🌙 Dark Mode
</button>

<button onclick="showHistory()" class="top-btn">
📖 View Past Tasks
</button>

</div>

<div class="container" id="dashboard">

<div class="left-side">

<div class="task-section">

<h2>📅 Daily Tasks</h2>

<div class="progress-bar">
<div id="dailyProgress" class="progress-fill"></div>
</div>

<div id="dailyPercent" class="percent">
0% Complete
</div>

<div class="input-group">

<input id="dailyInput"
placeholder="Add daily task...">

<button
class="add-btn"
onclick="addTask('daily')">
Add
</button>

</div>

<div id="dailyTasks"></div>

</div>

<div class="task-section">

<h2>📖 Weekly Tasks</h2>

<div class="progress-bar">
<div id="weeklyProgress" class="progress-fill"></div>
</div>

<div id="weeklyPercent" class="percent">
0% Complete
</div>

<div class="input-group">

<input id="weeklyInput"
placeholder="Add weekly task...">

<button
class="add-btn"
onclick="addTask('weekly')">
Add
</button>

</div>

<div id="weeklyTasks"></div>

</div>

<div class="task-section">

<h2>🗓 Monthly Tasks</h2>

<div class="progress-bar">
<div id="monthlyProgress" class="progress-fill"></div>
</div>

<div id="monthlyPercent" class="percent">
0% Complete
</div>

<div class="input-group">

<input id="monthlyInput"
placeholder="Add monthly task...">

<button
class="add-btn"
onclick="addTask('monthly')">
Add
</button>

</div>

<div id="monthlyTasks"></div>

</div>

</div>

<div class="completed-section">

<h2>✅ Completed Tasks</h2>

<div id="completedTasks"></div>

<button
class="clear-btn"
onclick="clearCompleted()">

Clear Completed Tasks

</button>

</div>

</div>

<div id="historyPage">

<h2 style="text-align:center;margin-bottom:20px;">
Past Completed Tasks
</h2>

<div id="historyTasks"></div>

<div style="text-align:center;margin-top:20px;">

<button
class="top-btn"
onclick="backToDashboard()">

⬅ Back To Dashboard

</button>

</div>

</div>

<script>

let tasks =
JSON.parse(
localStorage.getItem("taskManager")
) || {

daily:[],
weekly:[],
monthly:[],
completed:[],

stats:{
daily:0,
weekly:0,
monthly:0
},

resets:{
daily:"",
weekly:"",
monthly:""
}

};

function saveTasks(){

localStorage.setItem(
"taskManager",
JSON.stringify(tasks)
);

}

function checkResets(){

const now = new Date();

const todayKey =
now.toDateString();

if(tasks.resets.daily !== todayKey){

tasks.stats.daily = 0;
tasks.resets.daily = todayKey;

}

let monday = new Date(now);

monday.setDate(
now.getDate() -
now.getDay() + 1
);

const weekKey =
monday.toDateString();

if(tasks.resets.weekly !== weekKey){

tasks.stats.weekly = 0;
tasks.resets.weekly = weekKey;

}

const monthKey =
now.getFullYear() + "-" +
(now.getMonth()+1);

if(tasks.resets.monthly !== monthKey){

tasks.stats.monthly = 0;
tasks.resets.monthly = monthKey;

}

saveTasks();

}

function addTask(type){

const input =
document.getElementById(
type + "Input"
);

const text =
input.value.trim();

if(!text) return;

tasks[type].push(text);

input.value="";

saveTasks();
renderTasks();

}

function completeTask(type,index){

const task = tasks[type][index];

tasks.completed.push({
text:task,
category:type
});

let history =
JSON.parse(
localStorage.getItem(
"taskHistory"
)
) || [];

history.push({

text:task,
category:type,
date:new Date()
.toLocaleString()

});

localStorage.setItem(
"taskHistory",
JSON.stringify(history)
);

tasks.stats[type]++;

tasks[type].splice(index,1);

saveTasks();

renderTasks();

}

function clearCompleted(){

tasks.completed=[];

saveTasks();

renderTasks();

}

function renderTasks(){

["daily","weekly","monthly"]
.forEach(type=>{

const container =
document.getElementById(
type + "Tasks"
);

container.innerHTML="";

tasks[type].forEach(
(task,index)=>{

container.innerHTML += `

<div class="task">

<input
type="checkbox"
onchange="
completeTask(
'${type}',
${index}
)
">

<span>${task}</span>

</div>

`;

});

});

const completed =
document.getElementById(
"completedTasks"
);

completed.innerHTML="";

tasks.completed.forEach(task=>{

completed.innerHTML += `

<div class="completed-task">

<span class="tag">

${task.category.toUpperCase()}

</span>

<span>
${task.text}
</span>

</div>

`;

});

updateProgress();

}

function updateProgress(){

["daily","weekly","monthly"]
.forEach(type=>{

const total =
tasks[type].length +
tasks.stats[type];

const percent =
total === 0
? 0
: Math.round(
(tasks.stats[type] /
total) * 100
);

document.getElementById(
type + "Progress"
).style.width =
percent + "%";

document.getElementById(
type + "Percent"
).innerText =
percent + "% Complete";

});

}

function showHistory(){

document.getElementById(
"dashboard"
).style.display = "none";

document.getElementById(
"topBar"
).style.display = "none";

document.getElementById(
"historyPage"
).style.display = "block";

const history =
JSON.parse(
localStorage.getItem(
"taskHistory"
)
) || [];

const historyBox =
document.getElementById(
"historyTasks"
);

historyBox.innerHTML="";

history.reverse().forEach(task=>{

historyBox.innerHTML += `

<div class="history-item">

<strong>

${task.category.toUpperCase()}

</strong>

- ${task.text}

<br>

<span class="history-date">

${task.date}

</span>

</div>

`;

});

}

function backToDashboard(){

document.getElementById(
"dashboard"
).style.display = "grid";

document.getElementById(
"topBar"
).style.display = "flex";

document.getElementById(
"historyPage"
).style.display = "none";

}

checkResets();

renderTasks();

const toggle =
document.getElementById(
"themeToggle"
);

if(
localStorage.getItem("theme")
==="light"
){

document.body.classList.add(
"light"
);

toggle.innerText =
"☀️ Light Mode";

}

toggle.addEventListener(
"click",
()=>{

document.body.classList.toggle(
"light"
);

if(
document.body.classList.contains(
"light"
)
){

localStorage.setItem(
"theme",
"light"
);

toggle.innerText =
"☀️ Light Mode";

}else{

localStorage.setItem(
"theme",
"dark"
);

toggle.innerText =
"🌙 Dark Mode";

}

}
);

</script>

</body>
</html>
